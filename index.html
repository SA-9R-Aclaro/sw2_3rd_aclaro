<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
    <title>Intramurals Team Selection</title>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #87ceeb 0%, #e0ffff 100%);
            padding: 20px;
            min-height: 100vh;
        }

        h2{
            font-weight: 800;
            font-size: 300%;
            color: darkblue;
        }

        .btn, .btn-signup {
            width: 100%;
            padding: 12px;
            background-color: green;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            font-weight: 600;
        }
        
        .btn:hover {
            background-color: darkgreen;
            color: white;
        }

        .form-label{
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 10px;
            color: darkblue;
        }

        .form-check{
            background-color: white;
            width: 60%;
            border-radius: 5px;
            padding: 10px;
            color: darkblue;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 2px solid lightblue;
        }

        .form-check:hover{
            border: 2px solid blue;
            background-color: lightblue;
        }

        .form-check-input{
            cursor: pointer;
            background-color: lightblue;
            border: 2px solid blue;
        }

        .form-check-input:hover{
            cursor: pointer;
        }

        .mb-3{
            margin-bottom: 25px !important;
        }

        .form-check-label{
            cursor: pointer;
            color: darkblue;
        }

        .card{
            background-color: white;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 3px solid green;
        }

        #level {
            background-color: lightblue;
            padding: 10px;
            border-radius: 10px;
            color: darkblue;
            font-weight: bold;
            cursor:pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            border: 2px solid blue;
        }

        #level:hover{
            background-color: cornflowerblue;
        }

        #section {
            background-color: lightyellow;
            padding: 10px;
            border-radius: 10px;
            color: darkgreen;
            font-weight: bold;
            cursor:pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            border: 2px solid orange;
        }

        #section:hover{
            background-color: khaki;
        }

        .image-config {
            background-color: #f0f8ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid green;
        }

        .image-config label {
            font-weight: 600;
            color: darkblue;
            display: block;
            margin-top: 10px;
        }

        .image-config input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid lightblue;
            border-radius: 5px;
            box-sizing: border-box;
        }

    </style>

    
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 w-50" id="box">
        <center>
        <h2 class="text-center">Intramurals Team Selection</h2>
        <p>Go Team! Show Your Spirit! 🎉</p>
        <hr>
        <br>
        <form>
            <div class="mb-3">
                <label class="form-label">Have you registered for intramurals?</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="registered" name="registration" value="registered">
                    <label class="form-check-label" for="registered">Yes</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="notRegistered" name="registration" value="notRegistered">
                    <label class="form-check-label" for="notRegistered">No</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Are you fit to participate?</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="cleared" name="clearance" value="cleared">
                    <label class="form-check-label" for="cleared">Yes</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="notCleared" name="clearance" value="notCleared">
                    <label class="form-check-label" for="notCleared">No</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">What's your Grade & Team?</label><br>
                <select id="level" class="form-select mb-2">
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                </select>
                <select id="section" class="form-select">
                    <option value='red'>🔴 Red Bulldogs</option>
                    <option value='blue'>🔵 Blue Bears</option>
                    <option value='yellow'>🟡 Yellow Tigers</option>
                    <option value='green'>💚 Green Hornets</option>
                </select>
            </div>

            <div class="d-grid">
                <input type="button" py-click="regiment_checker" value="Sign up" class="btn btn-signup">
            </div>
        </form>
        
        <center>
        <div id="image" class="mt-3"></div>
        <div id="output" class="mt-3"></div>
        <div id="leader" class="mt-3"></div>
        </center>
    </div>
    </center>
    <py-script src="main.py"></py-script>
</body>
</html>
